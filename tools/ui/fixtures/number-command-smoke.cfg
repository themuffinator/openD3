// Semantic commands exercise current-buffer layout after gameplay. No device
// input is injected. The Number fixture must already be open with testGUI.
opend3_retainedGui focus "number"
opend3_retainedGui number begin "number"
opend3_retainedGui number replace "number" "1.25"
opend3_retainedGui number command "number" "left" "extend"
wait 3
opend3_retainedGui widget "number"
screenshot "screenshots/number-selection.tga"
opend3_retainedGui number command "number" "backspace"
wait 3
opend3_retainedGui widget "number"
screenshot "screenshots/number-deleted.tga"
opend3_retainedGui number undo "number"
wait 3
opend3_retainedGui widget "number"
screenshot "screenshots/number-undo.tga"
// These commands intentionally share one event batch, without a painted frame
// between replacements and movement through the newly measured buffer.
opend3_retainedGui number command "number" "select-all"
opend3_retainedGui number replace "number" "1.875"
opend3_retainedGui number command "number" "left" "extend"
opend3_retainedGui number command "number" "left" "extend"
opend3_retainedGui widget "number"
opend3_retainedGui number command "number" "backspace"
opend3_retainedGui number undo "number"
opend3_retainedGui number command "number" "end"
opend3_retainedGui number command "number" "home" "extend"
opend3_retainedGui number replace "number" "1.375"
opend3_retainedGui number commit "number"
wait 3
opend3_retainedGui widget "number"
r_brightness
screenshot "screenshots/number-accepted.tga"
echo NUMBER_COMMAND_SMOKE_COMPLETE
