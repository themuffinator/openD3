// Normal session diagnostics; no host mouse, keyboard or controller input.
opend3_retainedGui report
opend3_retainedGui focus "managed-brightness"
opend3_retainedGui menu accept 1
opend3_retainedGui menu accept 0
wait 2
opend3_retainedGui report
opend3_retainedGui focus "managed-shadows"
opend3_retainedGui menu accept 1
opend3_retainedGui menu accept 0
wait 2
opend3_retainedGui report
opend3_retainedGui save
// Commit a different application batch and apply it to the real host CVars.
opend3_retainedGui state "brightnessTarget" "1.25"
opend3_retainedGui state "shadowsTarget" "true"
opend3_retainedGui focus "managed-brightness"
opend3_retainedGui menu accept 1
opend3_retainedGui menu accept 0
opend3_retainedGui focus "managed-shadows"
opend3_retainedGui menu accept 1
opend3_retainedGui menu accept 0
wait 2
opend3_retainedGui report
opend3_guiGet "brightness-target-reading::text"
opend3_guiGet "shadows-target-reading::text"
// Restore the framed native adapter payload and verify its following sentinel.
// Host sources stay authoritative; restoring must not replay either action.
opend3_retainedGui restore
wait 2
opend3_retainedGui report
opend3_guiGet "brightness-reading::text"
opend3_guiGet "shadows-reading::text"
opend3_guiGet "brightness-target-reading::text"
opend3_guiGet "shadows-target-reading::text"
